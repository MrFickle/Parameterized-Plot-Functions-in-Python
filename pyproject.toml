[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parameterized-plot-functions-in-python"
version = "0.1.0"
description = "A modular, config-driven matplotlib plotting library."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]
