[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parameterized-plot-functions-in-python"
version = "0.1.0"
description = "A modular, config-driven matplotlib plotting library."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
llm = ["openai>=1.40.0"]
mcp = ["mcp>=1.0.0"]
all = ["openai>=1.40.0", "mcp>=1.0.0"]

[project.scripts]
ppf = "parameterized_plot_functions.cli:main"
ppf-mcp = "parameterized_plot_functions.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
